
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Memory Match | Card Game</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen bg-slate-950 text-white">

    <!-- HOME SCREEN -->
    <section id="home-screen"
        class="min-h-screen flex items-center justify-center px-4">

        <div class="text-center max-w-xl">

            <div class="text-7xl mb-5">🧠</div>

            <h1 class="text-5xl font-extrabold mb-4">
                Memory <span class="text-purple-400">Match</span>
            </h1>

            <p class="text-gray-400 text-lg mb-8">
                Flip the cards, find matching pairs,
                and challenge your memory!
            </p>

            <h2 class="text-xl font-semibold mb-4">
                Select Difficulty
            </h2>

            <div class="flex flex-wrap justify-center gap-3 mb-8">

                <button class="difficulty-btn selected"
                        data-level="easy">
                    Easy
                </button>

                <button class="difficulty-btn"
                        data-level="medium">
                    Medium
                </button>

                <button class="difficulty-btn"
                        data-level="hard">
                    Hard
                </button>

            </div>

            <button id="start-btn"
                class="bg-purple-600 hover:bg-purple-500
                       px-10 py-4 rounded-xl text-xl font-bold
                       cursor-pointer transition">
                ▶ Play Game
            </button>

        </div>
    </section>

    <!-- GAME SCREEN -->
    <main id="game-screen"
          class="hidden max-w-4xl mx-auto px-4 py-8">

        <div class="flex justify-between items-center mb-8 gap-3">

            <h1 class="text-2xl sm:text-3xl font-bold">
                🧠 Memory <span class="text-purple-400">Match</span>
            </h1>

            <button id="home-btn"
                class="bg-slate-800 hover:bg-slate-700
                       px-4 py-2 rounded-lg cursor-pointer">
                Home
            </button>

        </div>

        <!-- STATISTICS -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">

            <div class="stat-box">
                <p>Moves</p>
                <h2 id="moves">0</h2>
            </div>

            <div class="stat-box">
                <p>Time</p>
                <h2 id="timer">00:00</h2>
            </div>

            <div class="stat-box">
                <p>Matches</p>
                <h2 id="matches">0/6</h2>
            </div>

            <div class="stat-box">
                <p>Best Moves</p>
                <h2 id="best-score">—</h2>
            </div>

        </div>

        <p id="level-label"
           class="text-center text-purple-300 mb-5 font-semibold">
            Easy Mode
        </p>

        <!-- GAME BOARD -->
        <div id="game-board"
             class="grid grid-cols-4 gap-2 sm:gap-4 max-w-2xl mx-auto">
        </div>

        <div class="flex justify-center gap-3 mt-8">

            <button id="restart-btn"
                class="bg-purple-600 hover:bg-purple-500
                       px-6 py-3 rounded-xl font-bold cursor-pointer">
                🔄 Restart
            </button>

            <button id="change-level-btn"
                class="bg-slate-700 hover:bg-slate-600
                       px-6 py-3 rounded-xl font-bold cursor-pointer">
                Change Level
            </button>

        </div>

    </main>

    <!-- VICTORY POPUP -->
    <div id="victory-modal"
         class="hidden fixed inset-0 bg-black/80
                items-center justify-center p-4 z-50"
         role="dialog"
         aria-modal="true"
         aria-labelledby="victory-title">

        <div class="victory-box text-center max-w-md w-full">

            <div class="text-6xl mb-4">🏆</div>

            <h2 id="victory-title"
                class="text-3xl font-bold text-purple-300 mb-3">
                Congratulations!
            </h2>

            <p class="text-gray-300 mb-5">
                You matched all the cards!
            </p>

            <p id="final-moves" class="mb-2"></p>
            <p id="final-time" class="mb-2"></p>
            <p id="final-best" class="mb-5"></p>

            <button id="play-again-btn"
                class="bg-purple-600 hover:bg-purple-500
                       px-8 py-3 rounded-xl font-bold cursor-pointer">
                Play Again
            </button>

        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
